<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deephaven Web API rollup table example</title>
    <script src="totals.js" type="text/javascript"></script>
    <link href="basic.css" rel="stylesheet" type="text/css" />
    <style>
      .config {
        display: flex;
      }
      .config select.multi {
        height: 200px;
        min-width: 100px;
      }
      .config .buttons {
        flex: 0 1 auto;
        flex-direction: column;
        display: flex;
        justify-content: center;
      }
      .config label,
      .config select {
        display: block;
      }
      .config label {
        font-weight: bold;
      }
      .togglable,
      .leaf {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <h3>Persistent Query Configurations</h3>
    <ul id="queries"></ul>
    <h3>Rollup Table Configuration</h3>
    <div class="config">
      <div>
        <label for="sourceColumns">Source Columns</label>
        <select id="sourceColumns" multiple class="multi"></select>
      </div>
      <div class="buttons">
        <button id="move-agg" title="Move to Aggregation">&gt; Agg</button>
        <button id="move-tree" title="Move to Hierarchy">&gt; Hier</button>
        <button id="move-source" title="Move to Source">&lt; Source</button>
      </div>
      <div>
        <label for="treeColumns">Hierarchy Columns</label>
        <select id="treeColumns" multiple class="multi"></select>
      </div>
      <div>
        <label for="aggColumns">Aggregation Columns</label>
        <select id="aggColumns" multiple class="multi"></select>
        <br />
        <label for="operation">Aggregation Operation</label>
        <select id="operation">
          <option value="Count">Count</option>
          <option value="CountDistinct">Count Distinct</option>
          <option value="Distinct">Distinct</option>
          <option value="Min">Min</option>
          <option value="Max">Max</option>
          <option value="Sum" selected>Sum</option>
          <option value="AbsSum" selected>Absolute Sum</option>
          <option value="Var">Var</option>
          <option value="Avg">Avg</option>
          <option value="Std">Std</option>
          <option value="First">First</option>
          <option value="Last">Last</option>
          <option value="Unique">Unique</option>
        </select>
        <br />
        <label for="na-operation">Non-Aggregated Column Operation</label>
        <select id="na-operation">
          <option value="First">First</option>
          <option value="Skip">Skip</option>
        </select>
      </div>
    </div>
    <input id="includeConstituents" type="checkbox" /><label
      for="includeConstituents"
      >Include Constituent Values</label
    ><br />
    <input id="includeNonAggregated" type="checkbox" /><label
      for="includeNonAggregated"
      >Include Non-Aggregated Columns</label
    ><br />
    <button id="open">Display Rollup Table</button>
    <div id="treetable"></div>
    <script type="module">
      import dh from "./dh-core.js";

      const { CoreClient, AggregationOperation } = dh;

      import { TreeGrid } from "./treegrid.js";
      var connection;
      var ide;
      var treeParent = document.getElementById("treetable");
      var sourceColumns = document.getElementById("sourceColumns");
      var treeColumns = document.getElementById("treeColumns");
      var aggColumns = document.getElementById("aggColumns");

      var oldTableHandlerCleanup;
      (async () => {
        var client = new CoreClient(
          window.location.protocol + "//" + window.location.host
        );
        await client.login({ type: CoreClient.LOGIN_TYPE_ANONYMOUS });
        connection = await client.getAsIdeConnection();

        var types = await connection.getConsoleTypes();

        if (types.indexOf("python") !== -1) {
          ide = await connection.startSession("python");
          await ide.runCode(`
from deephaven import empty_table
remoteTable = empty_table(100).update(formulas = ["I=i", "J = \`J\` + (int)(i/10)", "K = i % 13"])
`);
        } else if (types.indexOf("groovy") !== -1) {
          ide = await connection.startSession("groovy");
          await ide.runCode(
            'remoteTable = emptyTable(100).update("I=i", "J = `` + (int)(i/10)", "K = i % 13")'
          );
        }

        displayTableDetails(await ide.getTable("remoteTable"));

        // wire up buttons to move items back and forth
        document.getElementById("move-source").onclick = (e) => {
          var moved = getSelectedValues(aggColumns);
          if (moved.length > 0) {
            addToSelect(sourceColumns, moved).map(
              (opt) => (opt.selected = true)
            );
            removeFromSelect(aggColumns, moved);
          } else {
            moved = getSelectedValues(treeColumns);
            addToSelect(sourceColumns, moved).map(
              (opt) => (opt.selected = true)
            );
            removeFromSelect(treeColumns, moved);
          }
        };
        document.getElementById("move-agg").onclick = (e) => {
          var moved = getSelectedValues(treeColumns);
          if (moved.length > 0) {
            addToSelect(aggColumns, moved).map((opt) => (opt.selected = true));
            removeFromSelect(treeColumns, moved);
          } else {
            moved = getSelectedValues(sourceColumns);
            addToSelect(aggColumns, moved).map((opt) => (opt.selected = true));
            removeFromSelect(sourceColumns, moved);
          }
        };

        document.getElementById("move-tree").onclick = (e) => {
          var moved = getSelectedValues(aggColumns);
          if (moved.length > 0) {
            addToSelect(treeColumns, moved).map((opt) => (opt.selected = true));
            removeFromSelect(aggColumns, moved);
          } else {
            moved = getSelectedValues(sourceColumns);
            addToSelect(treeColumns, moved).map((opt) => (opt.selected = true));
            removeFromSelect(sourceColumns, moved);
          }
        };

        function removeFromSelect(select, values) {
          Array.prototype.filter
            .call(select.options, (opt) => values.indexOf(opt.value) !== -1)
            .forEach((opt) => select.removeChild(opt));
        }

        function addToSelect(select, values) {
          return values.map((v) => {
            var option = document.createElement("option");
            option.value = v;
            option.textContent = v;
            select.appendChild(option);
            return option;
          });
        }

        function getAllValues(select) {
          return Array.prototype.map.call(
            select.options,
            (option) => option.value
          );
        }

        function getSelectedValues(select) {
          return Array.prototype.filter
            .call(select.options, (option) => option.selected)
            .map((option) => option.value);
        }

        var currentTable;

        function displayTableDetails(table) {
          closeAll();
          currentTable = table;
          // pick out the non-numeric fields for hierarchy
          var numeric = [];
          var nonNumeric = [];
          table.columns.forEach((c) => {
            switch (c.type) {
              case "int":
              case "double":
              case "long":
                numeric.push(c.name);
                break;
              default:
                nonNumeric.push(c.name);
                break;
            }
          });

          if (numeric.length < 1 || nonNumeric.length < 1) {
            console.error(
              "Need at least one numeric and one non-numeric column!"
            );
            treeParent.innerHTML =
              "<p>Need at least one numeric and one non-numeric column!</p>";
            return;
          }

          // clear the selects
          treeColumns.innerHTML = "";
          sourceColumns.innerHTML = "";
          aggColumns.innerHTML = "";

          addToSelect(treeColumns, [nonNumeric[0]]);
          addToSelect(aggColumns, [numeric[0]]);

          addToSelect(
            sourceColumns,
            nonNumeric.filter((c, i) => i > 0)
          );

          addToSelect(
            sourceColumns,
            numeric.filter((c, i) => i > 0)
          );
        }

        var currentTree;
        document.getElementById("open").onclick = (e) => {
          if (currentTable == null) {
            console.error("Need a table selected!");
            return;
          }
          closeTree();
          // collect the expected tree columns and aggregation columns, make into a config object
          var config = {
            groupingColumns: [],
            aggregations: {},
          };
          var operation = document.getElementById("operation").value;
          var naOperation = document.getElementById("na-operation").value;
          if (aggColumns.length > 0) {
            config.aggregations[operation] = getAllValues(aggColumns);
          }
          if (document.getElementById("includeNonAggregated").checked) {
            if (sourceColumns.length > 0) {
              config.aggregations[naOperation] = getAllValues(sourceColumns);
            }
          }
          config.groupingColumns = getAllValues(treeColumns);
          config.includeConstituents = document.getElementById(
            "includeConstituents"
          ).checked;

          console.log("Rollup config:", config);

          // roll up the selected table with the given config, and render it
          currentTable.rollup(config).then((treeTable) => {
            console.log("Rollup table:", treeTable, treeTable.columns);
            currentTree = treeTable;
            var tableElt = new TreeGrid(treeTable).element;
            treeParent.appendChild(tableElt);

            new TotalsTableHelper(null, treeTable, tableElt, 1);
          });
        };

        function closeAll() {
          currentTable && currentTable.close();
          closeTree();
        }

        function closeTree() {
          currentTree && currentTree.close();
          treeParent.innerHTML = "";
        }
      })();
    </script>
  </body>
</html>
